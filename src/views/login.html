<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ClubEvents</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="container">
    <h1>Sign In</h1>
    <div id="error-container" role="alert" style="color: red; margin-bottom: 1rem;"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submit-btn">Sign In</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorContainer = document.getElementById('error-container');

    let isSubmitting = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return;

      errorContainer.textContent = '';
      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const tokenRes = await fetch('/api/csrf-token');
        if (!tokenRes.ok) {
          throw new Error('Unable to fetch security token');
        }
        const tokenData = await tokenRes.json();
        const csrfToken = tokenData.csrfToken;
        if (typeof csrfToken !== 'string' || csrfToken.trim() === '') {
          throw new Error('Unable to fetch security token');
        }

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken
          },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });

        if (res.ok) {
          window.location.href = '/events';
          return;
        }

        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          errorContainer.textContent = data.error || 'Invalid email or password';
        } else {
          errorContainer.textContent = data.error || 'Unable to sign in. Please try again.';
        }
      } catch (err) {
        errorContainer.textContent = 'Unable to sign in. Please try again.';
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
